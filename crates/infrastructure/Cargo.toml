[package]
name = "masterdesk-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true

# Único crate autorizado a depender de sqlx (ADR-003). Implementações de
# tauri-plugin-* também moram aqui ou em src-tauri, nunca em domain/application.
[dependencies]
masterdesk-domain = { path = "../domain" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
