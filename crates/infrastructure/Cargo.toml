[package]
name = "masterdesk-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true

# Único crate autorizado a depender de sqlx (ADR-003). Implementações de
# tauri-plugin-* também moram aqui ou em src-tauri, nunca em domain/application.
[dependencies]
masterdesk-domain = { path = "../domain" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }

# Integração Mastersys (ADR-006). Ver "Política de dependências" no ADR.
#
# reqwest: cliente HTTP. As features default de 0.13 já são `rustls` +
# `rustls-platform-verifier`, ou seja TLS puro Rust validando contra a loja de
# certificados do SO (schannel/Security.framework/CA bundle do Linux). Isso
# atende CA corporativa em instalação self-hosted e dispensa OpenSSL no build.
reqwest = { version = "0.13", features = ["json"] }

# rust_socketio: cliente Socket.IO para o canal de tempo real do Mastersys
# (ADR-010). Pesquisa registrada na seção "Pesquisa da dependência" da ADR.
#
# Resumo do que foi verificado antes de adotar:
# - Protocolo: revisão 5 do socket.io / 4 do engine.io, que é o que o servidor
#   `socket.io@4.8.3` do Mastersys fala.
# - Licença MIT.
# - Path customizado (`/api/socket.io/`) funciona: `connect_raw` só injeta
#   `/socket.io/` quando o path da URL é `/`, preservando qualquer outro.
# - RESSALVA ACEITA PELO DEV: a crate está dormente (último release abr/2024,
#   último commit fev/2025). O risco é contido porque o tempo real é apenas
#   ACELERAÇÃO — o polling do `sync_scheduler` é o mecanismo garantido, e
#   remover esta dependência não custaria função, só latência.
#
# Sem a feature `async`, que o próprio projeto declara experimental ("the
# interface can be object to changes at any time"). O cliente síncrono roda em
# thread própria, que basta para o nosso uso: receber sinal e enfileirar sync.
rust_socketio = "0.6"

# keyring 3.x: cofre nativo do SO para o refresh token (CLAUDE §11/13).
# Fixado em 3.x de propósito — a 4.x migrou para `keyring-core` e exige
# registrar o store explicitamente, com documentação ainda escassa.
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
