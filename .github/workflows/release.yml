# Confere que o instalador do MasterNote compila. NAO publica.
#
# A publicacao acontece na maquina do DEV, por `scripts/release.ps1`, e nao aqui.
# O motivo e a chave: uma release do MasterNote carrega duas assinaturas, e a
# Ed25519 do deploy-base (`C:/chaves/deploy-base.pem`) por decisao de projeto
# nunca sai da maquina que publica -- e justamente o que faz o gateway e o CDN
# serem so transporte. Colocar essa chave num secret do Actions desfaria a
# propriedade que ela existe para garantir.
#
# Historico: ate 2026-09-05 este workflow disparava em tags `v*` e publicava com
# a `tauri-action` no proprio `ShinuuL/MasterDesk`. Isso ficou incompativel com a
# decisao de 2026-09-04 (instaladores no repo privado + gateway) em dois pontos:
# publicava no repo publico errado, e usava a tag `v0.2.0`, que nao casa com o
# padrao `<app>-v<semver>` pelo qual o gateway descobre os apps -- o portal nunca
# enxergaria a release. Ver `docs/ATUALIZACAO.md`.
name: release-check

on:
  workflow_dispatch:
  push:
    tags: ["masternote-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Cacheia `target/` — sem isso cada execucao recompila o grafo inteiro
      # (tauri, sqlx, reqwest) do zero, ~15 min.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci
        working-directory: frontend

      # Sem TAURI_SIGNING_PRIVATE_KEY: aqui o objetivo e saber se compila, e o
      # artefato gerado nao vai a lugar nenhum. O .nsis.zip sai sem assinatura e
      # seria rejeitado pelo updater -- por isso nao e publicado.
      - name: Build do instalador
        working-directory: src-tauri
        run: node ../frontend/node_modules/@tauri-apps/cli/tauri.js build

      - uses: actions/upload-artifact@v4
        with:
          name: masternote-installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 7
